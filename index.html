<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Clientes</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px; margin: 5px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: #f4f4f4; padding: 10px; margin-bottom: 5px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <h2>Mis Clientes</h2>
    <input type="text" id="nombreCliente" placeholder="Nombre del cliente">
    <button onclick="agregarCliente()">Agregar</button>
    <hr>
    <button onclick="exportarClientes()">Descargar (Exportar)</button>
    <input type="file" id="fileInput" onchange="importarClientes(event)">
    
    <ul id="listaClientes"></ul>

    <script>
        let clientes = JSON.parse(localStorage.getItem('misClientes')) || [];

        function renderizar() {
            const lista = document.getElementById('listaClientes');
            lista.innerHTML = '';
            clientes.forEach((c, index) => {
                lista.innerHTML += `<li>${c} <button onclick="eliminar(${index})">X</button></li>`;
            });
            localStorage.setItem('misClientes', JSON.stringify(clientes));
        }

        function agregarCliente() {
            const input = document.getElementById('nombreCliente');
            if(input.value) {
                clientes.push(input.value);
                input.value = '';
                renderizar();
            }
        }

        function eliminar(index) {
            clientes.splice(index, 1);
            renderizar();
        }

        function exportarClientes() {
            const blob = new Blob([JSON.stringify(clientes)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mis_clientes.json';
            a.click();
        }

        function importarClientes(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                clientes = JSON.parse(e.target.result);
                renderizar();
            };
            reader.readAsText(file);
        }

        renderizar();
    </script>
</body>
</html>
