<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Clientes</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0f172a; color: white; padding: 15px; font-family: sans-serif; }
        .box { max-width: 400px; margin: 0 auto; }
        input[type="text"] { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 16px; }
        button, .btn-link { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; cursor: pointer; color: white; font-size: 16px; text-align: center; }
        .btn-add { background-color: #0284c7; }
        .btn-export { background-color: #10b981; }
        .btn-import { background-color: #475569; display: block; }
        ul { list-style: none; padding: 0; margin-top: 15px; }
        li { background: #334155; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; word-break: break-all; }
        .btn-del { background: #ef4444; width: auto; padding: 6px 12px; font-size: 12px; margin: 0; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
<div class="box">
    <h1>Mis Clientes</h1>
    
    <form id="clientForm" onsubmit="add(event)">
        <input type="text" id="inputName" placeholder="Nombre del cliente..." required autocomplete="off">
        <button type="submit" class="btn-add">Agregar Cliente</button>
    </form>
    
    <ul id="list"></ul>

    <div style="margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px;">
        <button type="button" class="btn-export" onclick="exportData()">Descargar Backup</button>
        <label class="btn-link btn-import">
            Cargar Backup
            <input type="file" onchange="importData(event)">
        </label>
    </div>
</div>

<script>
    let clients = [];
    
    try {
        clients = JSON.parse(localStorage.getItem('my_clients')) || [];
    } catch(e) {
        clients = [];
    }

    function render() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        clients.forEach((c, i) => {
            list.innerHTML += `<li><span>${c}</span> <button type="button" class="btn-del" onclick="del(${i})">Eliminar</button></li>`;
        });
    }

    function add(e) {
        if (e) e.preventDefault(); // Evita que la página se recargue
        const input = document.getElementById('inputName');
        const val = input.value.trim();
        
        if (val !== "") {
            clients.push(val);
            localStorage.setItem('my_clients', JSON.stringify(clients));
            input.value = '';
            render();
        }
    }

    function del(i) {
        clients.splice(i, 1);
        localStorage.setItem('my_clients', JSON.stringify(clients));
        render();
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clients));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = "mis_clientes.json";
        a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                clients = JSON.parse(e.target.result);
                localStorage.setItem('my_clients', JSON.stringify(clients));
                render();
            } catch(err) {
                alert("Archivo inválido");
            }
        };
        reader.readAsText(file);
    }

    render();
</script>
</body>
</html>
