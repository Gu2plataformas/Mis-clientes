<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Clientes - GU2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background-color: #0369a1;
        }

        .client-list {
            list-style: none;
            margin-top: 10px;
        }

        .client-item {
            background-color: #334155;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background-color: #ef4444;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .actions {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-label {
            display: block;
            text-align: center;
            background-color: #334155;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mis Clientes</h1>

    <div class="form-group">
        <input type="text" id="clientName" placeholder="Nombre del cliente...">
        <button onclick="addClient()">Agregar</button>
    </div>

    <ul class="client-list" id="clientList"></ul>

    <div class="actions">
        <button onclick="exportData()" style="background-color: #10b981;">Descargar (Exportar)</button>
        <label class="file-label">
            Cargar Copia de Seguridad
            <input type="file" onchange="importData(event)">
        </label>
    </div>
</div>

<script>
    let clients = JSON.parse(localStorage.getItem('gu2_clients')) || [];

    function renderClients() {
        const list = document.getElementById('clientList');
        list.innerHTML = '';
        clients.forEach((client, index) => {
            const li = document.createElement('li');
            li.className = 'client-item';
            li.innerHTML = `
                <span>${client}</span>
                <button class="delete-btn" onclick="deleteClient(${index})">Eliminar</button>
            `;
            list.appendChild(li);
        });
        localStorage.setItem('gu2_clients', JSON.stringify(clients));
    }

    function addClient() {
        const input = document.getElementById('clientName');
        const name = input.value.trim();
        if (name) {
            clients.push(name);
            input.value = '';
            renderClients();
        }
    }

    function deleteClient(index) {
        clients.splice(index, 1);
        renderClients();
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clients));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "clientes_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importData(event) {
        const reader = new FileReader();
        reader.onload = function(e) {
            clients = JSON.parse(e.target.result);
            renderClients();
        };
        reader.readAsText(event.target.files[0]);
    }

    renderClients();
</script>

</body>
</html>
