<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GU2 - Mis Clientes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: white; padding: 15px; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 450px; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        
        /* Encabezado Nuevo Estilo Diseño */
        .header-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 20px; 
            padding-bottom: 10px;
            border-bottom: 2px solid #0284c7;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }
        .app-logo { 
            max-width: 150px; 
            max-height: 70px; 
            object-fit: contain; 
        }
        h1 { 
            font-size: 1.8rem; 
            color: #ffffff; 
            font-weight: 800;
        }
        .header-right {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-top-backup {
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            color: white;
            border: none;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .btn-top-backup:active { transform: scale(0.95); }
        .btn-descargar { background-color: #00b029; }
        .btn-cargar { background-color: #ff9900; display: block; text-align: center; }

        /* Formulario y Tarjetas */
        .form-card { background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .form-card h2 { font-size: 1rem; margin-bottom: 10px; color: #94a3b8; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 14px; transition: 0.2s; }
        .btn-add { background-color: #0284c7; margin-top: 5px; }
        .btn-cancel { background-color: #64748b; margin-top: 5px; display: none; }
        
        .search-box { margin-bottom: 15px; }
        .search-box input { background: #0f172a; border-color: #38bdf8; }
        .counter-box { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-top: -5px; margin-bottom: 15px; }
        
        ul { list-style: none; }
        .client-card { background: #334155; padding: 12px 15px; border-radius: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; position: relative; border-left: 6px solid #94a3b8; }
        
        .status-active { border-left-color: #22c55e !important; }
        .status-warning { border-left-color: #f59e0b !important; }
        .status-expired { border-left-color: #ef4444 !important; }

        .status-tag { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; width: fit-content; margin-bottom: 4px; }
        .tag-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .tag-warning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .tag-expired { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .client-title { font-weight: bold; font-size: 1.1rem; color: #f8fafc; }
        .client-info { font-size: 0.85rem; color: #cbd5e1; }
        .client-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        
        .btn-sm { width: auto; padding: 6px 10px; font-size: 12px; flex: 1; text-align: center; text-decoration: none; display: inline-block; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-renew { background: #0284c7; color: white; }
        .btn-edit { background: #f59e0b; color: white; }
        .btn-del { background: #ef4444; color: white; }
        .btn-wsp { background: #22c55e; color: white; }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="box">
    <!-- Encabezado con Logo, Título y Botones de Backup arriba -->
    <div class="header-container">
        <div class="header-left">
            <img src="LogoTvDigital1.png" alt="TV Digital Logo" class="app-logo">
            <h1>Mis Clientes</h1>
        </div>
        <div class="header-right">
            <button type="button" class="btn-top-backup btn-descargar" onclick="exportData()">Descargar Backup</button>
            <label class="btn-top-backup btn-cargar">
                Cargar Backup
                <input type="file" id="fileInput" onchange="importData(event)">
            </label>
        </div>
    </div>

    <!-- Formulario Agregar / Editar Cliente -->
    <div class="form-card">
        <h2 id="formTitle">Agregar nuevo cliente</h2>
        <input type="hidden" id="editIndex" value="-1">
        <input type="text" id="inputName" placeholder="Nombre completo *" required>
        <input type="text" id="inputUser" placeholder="Usuario">
        <input type="text" id="inputService" placeholder="Servicio (ej. Premium)">
        <input type="date" id="inputDate" placeholder="Fecha Vencimiento">
        <input type="text" id="inputWsp" placeholder="WhatsApp (ej. 549343...)">
        
        <button type="button" class="btn-add" id="btnSubmit" onclick="saveClient()">Guardar Cliente</button>
        <button type="button" class="btn-cancel" id="btnCancel" onclick="resetForm()">Cancelar Edición</button>
    </div>

    <!-- Búsqueda y Contador -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar cliente por nombre o usuario..." oninput="render()">
        <div id="counter" class="counter-box"></div>
    </div>

    <!-- Lista de Clientes -->
    <ul id="list"></ul>
</div>

<script>
    const initialClients = [
        { name: "Abril(novia Didier)", user: "Abril397@u2.com", service: "Premium (3 disp)", date: "2026-08-22", wsp: "" },
        { name: "Agustín", user: "agustin397@u2.com", service: "Premium (3 disp)", date: "2026-09-16", wsp: "" },
        { name: "Agustín(AMI Fernando/jorge)", user: "agustin@u2.com", service: "Premium (3 disp)", date: "2026-09-17", wsp: "" }
    ];

    let stored = localStorage.getItem('gu2_full_clients');
    let clients = stored ? JSON.parse(stored) : initialClients;

    function getStatus(dateString) {
        if (!dateString) return { class: '', tagClass: '', text: 'Sin Fecha', type: 'none' };
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const parts = dateString.split('-');
        const expDate = new Date(parts[0], parts[1] - 1, parts[2]);
        const diffTime = expDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        if (diffDays < 0) return { class: 'status-expired', tagClass: 'tag-expired', text: '🔴 VENCIDO', type: 'expired' };
        if (diffDays <= 5) return { class: 'status-warning', tagClass: 'tag-warning', text: '🟡 POR VENCER', type: 'warning' };
        return { class: 'status-active', tagClass: 'tag-active', text: '🟢 ACTIVO', type: 'active' };
    }

    function getWspMessage(c, status) {
        let baseMsg = `Hola ${c.name}, `;
        if (status.type === 'expired') return encodeURIComponent(`${baseMsg}te informo que tu servicio de ${c.service || ''} está VENCIDO desde el ${c.date}. Por favor, contáctame para regularizar.`);
        if (status.type === 'warning') return encodeURIComponent(`${baseMsg}te informo que tu servicio de ${c.service || ''} está POR VENCER el ${c.date}.`);
        return encodeURIComponent(`${baseMsg}gracias por usar nuestro servicio de ${c.service || ''}.`);
    }

    function renewClient(index) {
        const c = clients[index];
        let baseDate;
        
        if (c.date) {
            const parts = c.date.split('-');
            baseDate = new Date(parts[0], parts[1] - 1, parts[2]);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            if (baseDate < today) baseDate = today;
        } else {
            baseDate = new Date();
        }

        baseDate.setDate(baseDate.getDate() + 30);
        
        const year = baseDate.getFullYear();
        const month = String(baseDate.getMonth() + 1).padStart(2, '0');
        const day = String(baseDate.getDate()).padStart(2, '0');
        
        c.date = `${year}-${month}-${day}`;
        render();
    }

    function render() {
        const list = document.getElementById('list');
        const counter = document.getElementById('counter');
        const filter = document.getElementById('searchInput').value.toLowerCase();
        
        const sortedClients = [...clients].sort((a, b) => {
            if (!a.date) return 1;
            if (!b.date) return -1;
            return new Date(a.date) - new Date(b.date);
        });

        list.innerHTML = '';

        sortedClients.forEach((c) => {
            const matchesName = c.name && c.name.toLowerCase().includes(filter);
            const matchesUser = c.user && c.user.toLowerCase().includes(filter);

            if (matchesName || matchesUser) {
                const originalIndex = clients.indexOf(c);
                const status = getStatus(c.date);
                const li = document.createElement('li');
                li.className = `client-card ${status.class}`;
                
                let wspBtn = '';
                if (c.wsp) {
                    const wspUrl = `https://wa.me/${c.wsp.replace(/[^0-9]/g, '')}?text=${getWspMessage(c, status)}`;
                    wspBtn = `<a href="${wspUrl}" target="_blank" class="btn-sm btn-wsp">WhatsApp</a>`;
                }
                
                let userHtml = c.user ? `<div class="client-info">👤 <b>Usuario:</b> ${c.user}</div>` : '';

                li.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div class="client-title">${c.name}</div>
                        <span class="status-tag ${status.tagClass}">${status.text}</span>
                    </div>
                    ${userHtml}
                    <div class="client-info">📺 <b>Servicio:</b> ${c.service || 'N/A'}</div>
                    <div class="client-info">📅 <b>Vence:</b> ${c.date || 'N/A'}</div>
                    <div class="client-actions">
                        <button class="btn-sm btn-renew" onclick="renewClient(${originalIndex})">➕ 30d</button>
                        ${wspBtn}
                        <button class="btn-sm btn-edit" onclick="editClient(${originalIndex})">Editar</button>
                        <button class="btn-sm btn-del" onclick="delClient(${originalIndex})">Eliminar</button>
                    </div>
                `;
                list.appendChild(li);
            }
        });
        
        counter.innerText = `Total de clientes: ${clients.length}`;
        localStorage.setItem('gu2_full_clients', JSON.stringify(clients));
    }

    function saveClient() {
        const name = document.getElementById('inputName').value.trim();
        const user = document.getElementById('inputUser').value.trim();
        const service = document.getElementById('inputService').value.trim();
        const date = document.getElementById('inputDate').value;
        const wsp = document.getElementById('inputWsp').value.trim();
        const editIndex = parseInt(document.getElementById('editIndex').value);
        
        if (!name) { alert('Por favor, ingresá el nombre.'); return; }
        
        const clientData = { name, user, service, date, wsp };
        if (editIndex === -1) { clients.push(clientData); } else { clients[editIndex] = clientData; }
        resetForm(); render();
    }

    function editClient(index) {
        const c = clients[index];
        document.getElementById('inputName').value = c.name;
        document.getElementById('inputUser').value = c.user || '';
        document.getElementById('inputService').value = c.service || '';
        document.getElementById('inputDate').value = c.date || '';
        document.getElementById('inputWsp').value = c.wsp || '';
        document.getElementById('editIndex').value = index;
        document.getElementById('formTitle').innerText = 'Editando a: ' + c.name;
        document.getElementById('btnSubmit').innerText = 'Guardar Cambios';
        document.getElementById('btnCancel').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('inputName').value = '';
        document.getElementById('inputUser').value = '';
        document.getElementById('inputService').value = '';
        document.getElementById('inputDate').value = '';
        document.getElementById('inputWsp').value = '';
        document.getElementById('editIndex').value = '-1';
        document.getElementById('formTitle').innerText = 'Agregar nuevo cliente';
        document.getElementById('btnSubmit').innerText = 'Guardar Cliente';
        document.getElementById('btnCancel').style.display = 'none';
    }

    function delClient(index) {
        if (confirm('¿Eliminar a ' + clients[index].name + '?')) { clients.splice(index, 1); render(); }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clients, null, 2));
        const a = document.createElement('a'); a.href = dataStr; a.download = "mis_clientes_backup.json"; a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try { 
                let rawText = e.target.result.trim();
                if (rawText.charCodeAt(0) === 0xFEFF) { rawText = rawText.substr(1); } // Limpia caracteres invisibles BOM
                const parsedData = JSON.parse(rawText);
                if (Array.isArray(parsedData)) {
                    clients = parsedData;
                    render();
                    alert('¡' + clients.length + ' clientes cargados con éxito!');
                } else {
                    alert('El archivo no contiene una lista válida de clientes.');
                }
            } catch(err) { 
                alert('Archivo no válido. Asegurate de seleccionar un archivo .json correcto.'); 
            }
            document.getElementById('fileInput').value = '';
        };
        reader.readAsText(file);
    }

    render();
</script>
</body>
</html>
